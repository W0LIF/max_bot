services:
  api:
    build:
      context: .
      args:
        APP: server
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.db
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    restart: unless-stopped

  bot:
    build:
      context: .
      args:
        APP: bot
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - app-data:/data
    restart: unless-stopped

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-dependencies:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app-data:
  frontend-dependencies:
